[project]
name = "bill-maker"
version = "0.1.0"
description = "Telegram GST invoice generator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-telegram-bot==21.6",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "xlsx2html==0.6.4",
    "xhtml2pdf>=0.2.20,<0.3",
]

[tool.vercel]
entrypoint = "api.webhook:handler"
